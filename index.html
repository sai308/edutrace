        <!--
      Apply the persisted theme class before first paint.
      Mirrors what useColorMode() does on mount, so there is no flash of the
      wrong theme while the Vue bundle is downloading and executing.
      Storage key "vueuse-color-scheme" is the VueUse default.
    -->
        <script>
            ;(function () {
                var s = localStorage.getItem('vueuse-color-scheme')
                var dark = s === 'dark' || (!s && matchMedia('(prefers-color-scheme: dark)').matches)
                if (dark) document.documentElement.classList.add('dark')
            })()
        </script>

        <!--
      Loading shell — displayed from the moment HTML is parsed until Vue's
      mount() call replaces the contents of #app with the component tree.
      Colors are hardcoded hex (not CSS vars) because style.css hasn't loaded yet.
      Light bg #fafaf9 ≈ oklch(0.9821 0 0) --background
      Dark  bg #09090b matches theme-color meta and manifest background_color
    -->
        <style>
            #app-loading {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 20px;
                background: #09090b;
            }

            /* Ring + logo lockup */
            .loading-lockup {
                position: relative;
                width: 112px;
                height: 112px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            /* Spinning arc orbits the logo */
            .loading-ring {
                position: absolute;
                inset: 0;
                border-radius: 50%;
                border: 3px solid #27272a;
                border-top-color: #a1a1aa;
                animation: edutrace-spin 0.9s linear infinite;
            }

            /* Logo sits still at center */
            .loading-logo {
                width: 72px;
                height: auto;
                flex-shrink: 0;
            }

            #app-loading span {
                font-size: 13px;
                font-family:
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    sans-serif;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: #52525b;
            }

            @keyframes edutrace-spin {
                to {
                    transform: rotate(360deg);
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .loading-ring {
                    animation: none;
                    opacity: 0.3;
                }
            }
        </style>
    </head>
