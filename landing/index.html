    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #09090b;
            --surface: #18181b;
            --border: #27272a;
            --muted: #52525b;
            --subtle: #71717a;
            --text: #fafaf9;
            --text-dim: #a1a1aa;
            --accent: #6ee5bf;
            --accent-dim: #3d9e86;
            --radius: 12px;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.25rem;
        }

        .wordmark {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 1rem;
        }

        h1 {
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.1;
            text-align: center;
            margin-bottom: 1rem;
        }

        .tagline {
            font-size: 1.0625rem;
            color: var(--text-dim);
            text-align: center;
            max-width: 36ch;
            line-height: 1.6;
            margin-bottom: 3rem;
        }

        .apps {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            width: 100%;
            max-width: 400px;
        }

        .app-card {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.25rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            text-decoration: none;
            color: inherit;
            transition: border-color 0.15s, background 0.15s;
        }

        .app-card:hover {
            border-color: var(--accent-dim);
            background: #1f1f23;
        }

        .app-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            flex-shrink: 0;
            overflow: hidden;
        }

        .app-icon svg {
            width: 40px;
            height: 40px;
            display: block;
        }

        .app-info {
            flex: 1;
            min-width: 0;
        }

        .app-name {
            font-size: 0.9375rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .badge {
            font-size: 0.6875rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            padding: 0.1em 0.5em;
            border-radius: 99px;
            background: color-mix(in srgb, var(--accent) 15%, transparent);
            color: var(--accent);
            border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
        }

        .app-desc {
            font-size: 0.8125rem;
            color: var(--text-dim);
            margin-top: 0.15rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .app-arrow {
            color: var(--muted);
            flex-shrink: 0;
            transition: color 0.15s, transform 0.15s;
        }

        .app-card:hover .app-arrow {
            color: var(--accent);
            transform: translateX(2px);
        }

        .coming-soon {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.25rem;
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            color: var(--muted);
        }

        .coming-soon-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--surface);
            border: 1px dashed var(--border);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--border);
        }

        .coming-soon-label {
            font-size: 0.875rem;
            color: var(--muted);
        }

        footer {
            margin-top: 3.5rem;
            font-size: 0.8125rem;
            color: var(--muted);
            text-align: center;
        }

        footer a {
            color: var(--subtle);
            text-decoration: none;
        }

        footer a:hover {
            color: var(--text-dim);
        }
    </style>
</head>
